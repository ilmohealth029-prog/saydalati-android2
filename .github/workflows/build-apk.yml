
name: Build Saydalati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Python image tools
        run: python3 -m pip install --quiet Pillow

      - name: Create Android project and launcher icons
        run: |
          mkdir -p app/src/main/java/com/ilmohealth/app
          mkdir -p app/src/main/assets

          if [ ! -f icon.png ]; then
            echo "ERROR: icon.png is missing from repository root"
            exit 1
          fi

          find . -maxdepth 1 -type f \( \
            -name '*.html' -o \
            -name '*.js' -o \
            -name '*.css' -o \
            -name '*.json' -o \
            -name '*.png' \
          \) -exec cp {} app/src/main/assets/ \;

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = Path("app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          print("Saydalati launcher icons generated successfully.")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Saydalati"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ilmohealth.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ilmohealth.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="صيدليتي"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ilmohealth/app/MainActivity.java <<'EOF'
          package com.ilmohealth.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saydalati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
