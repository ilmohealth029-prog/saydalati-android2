
name: Build Saydalati APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Python image tools
        run: python3 -m pip install --quiet Pillow

      - name: Create Android project and launcher icons
        run: |
          mkdir -p app/src/main/java/com/ilmohealth/app
          mkdir -p app/src/main/assets

          if [ ! -f icon.png ]; then
            echo "ERROR: icon.png is missing from repository root"
            exit 1
          fi

          find . -maxdepth 1 -type f \( \
            -name '*.html' -o \
            -name '*.js' -o \
            -name '*.css' -o \
            -name '*.json' -o \
            -name '*.png' \
          \) -exec cp {} app/src/main/assets/ \;
          mkdir -p app/src/main/assets/company-logos

          curl -fL --retry 3 "https://annabaa.org/aarticles/fileM/5700fccdb708a.jpg" -o app/src/main/assets/company-logos/sdi.jpg

          curl -fL --retry 3 "https://barcoaliraq.com/assets/uploads/project-1.jpeg" -o app/src/main/assets/company-logos/awamedica.jpeg

          curl -fL --retry 3 "https://cdn.theorg.com/64a24cc3-6c20-4375-b6e5-336a3011ac04_small.jpg" -o app/src/main/assets/company-logos/pioneer.jpg

          curl -fL --retry 3 "https://alfayhaaco.com/wp-content/uploads/2024/07/sama-logo-2-01-2.png" -o app/src/main/assets/company-logos/fayha.png

          curl -fL --retry 3 "https://static.wixstatic.com/media/0534ba_b6d3f34521f94833ab05cfe39b0ba810~mv2.png" -o app/src/main/assets/company-logos/alkindi.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = Path("app/src/main/res") / folder
              target.mkdir(parents=True, exist_ok=True)

              icon = source.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          print("Saydalati launcher icons generated successfully.")
          PY

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Saydalati"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.ilmohealth.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.ilmohealth.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="صيدليتي"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/ilmohealth/app/MainActivity.java <<'EOF'
          package com.ilmohealth.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.net.Uri;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.MimeTypeMap;

          import java.io.InputStream;
          import java.io.IOException;

          public class MainActivity extends Activity {
              private WebView webView;

              private WebResourceResponse loadAsset(String url) {
                  Uri uri = Uri.parse(url);

                  if (!"appassets.androidplatform.net".equals(uri.getHost())) {
                      return null;
                  }

                  String path = uri.getPath();

                  if (path == null || !path.startsWith("/assets/")) {
                      return null;
                  }

                  String fileName = path.substring("/assets/".length());

                  if (fileName.isEmpty() || fileName.contains("..")) {
                      return null;
                  }

                  try {
                      InputStream stream = getAssets().open(fileName);

                      String extension =
                          MimeTypeMap.getFileExtensionFromUrl(fileName);

                      String mime =
                          MimeTypeMap.getSingleton()
                              .getMimeTypeFromExtension(extension);

                      if (mime == null) {
                          mime = "application/octet-stream";
                      }

                      String encoding = null;

                      if (mime.startsWith("text/")
                              || mime.contains("javascript")
                              || mime.contains("json")
                              || mime.contains("xml")) {
                          encoding = "UTF-8";
                      }

                      return new WebResourceResponse(
                          mime,
                          encoding,
                          stream
                      );

                  } catch (IOException e) {
                      return null;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              WebResourceRequest request) {
                          return loadAsset(
                              request.getUrl().toString()
                          );
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(
                              WebView view,
                              String url) {
                          return loadAsset(url);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);

                  webView.loadUrl(
                      "https://appassets.androidplatform.net/assets/index.html"
                  );
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saydalati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
