
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087fa8">
<title>المبرمجين | ILMO Health</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #eaf9ff, #f7fcff);
  color: #163746;
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, #087fa8, #20b8d5);
  color: white;
  text-align: center;
  padding: 30px 16px;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 5px 18px #087fa833;
}

.logo {
  font-size: 36px;
  margin-bottom: 8px;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 10px 0 0;
  font-size: 14px;
}

.container {
  max-width: 650px;
  margin: 25px auto;
  padding: 0 16px 30px;
}

.section-title {
  text-align: center;
  margin-bottom: 20px;
  color: #087fa8;
  font-size: 22px;
}

.member {
  background: white;
  border: 1px solid #d7eff7;
  border-radius: 20px;
  padding: 22px 18px;
  margin-bottom: 16px;
  box-shadow: 0 5px 18px #087fa812;
  display: flex;
  align-items: center;
  gap: 15px;
  transition: transform 0.2s;
}

.member:hover {
  transform: translateY(-3px);
}

.member-icon {
  width: 58px;
  height: 58px;
  flex-shrink: 0;
  border-radius: 17px;
  background: #e4f6fc;
  color: #087fa8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
}

.member-info h2 {
  margin: 0 0 8px;
  font-size: 15px;
  color: #087fa8;
}

.member-info p {
  margin: 0;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.8;
}

footer {
  text-align: center;
  color: #64818d;
  font-size: 13px;
  padding: 15px;
}

.back {
  display: block;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #087fa8;
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 16px;
  margin-top: 24px;
}
</style>
</head>

<body>

<header>
  <div class="logo">💻</div>
  <h1>المبرمجين</h1>
  <p>فريق تطوير تطبيق ILMO Health</p>
</header>

<main class="container">
  <h2 class="section-title">أعضاء فريق العمل</h2>

  <section class="member">
    <div class="member-icon">👨‍💻</div>
    <div class="member-info">
      <h2>مبرمج البرنامج</h2>
      <p>الطالب إياد محمد الدليمي</p>
    </div>
  </section>

  <section class="member">
    <div class="member-icon">🤝</div>
    <div class="member-info">
      <h2>مساعد</h2>
      <p>الطالب محمد رضا إياد تكي</p>
    </div>
  </section>

  <section class="member">
    <div class="member-icon">🤝</div>
    <div class="member-info">
      <h2>مساعد</h2>
      <p>الطالب مقتدى حسين رميح (وطن)</p>
    </div>
  </section>

  <a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a>
</main>

<footer>
  ILMO Health © 2026
</footer>

</body>
</html>
